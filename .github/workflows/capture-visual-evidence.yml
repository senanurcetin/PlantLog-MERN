name: Rebuild guest demo visual evidence

# Only a documentation-namespaced branch; never executes on untrusted PR events.
on:
  push:
    branches:
      - 'docs/*visual-evidence*'

# Serialize updates to a single documentation branch to avoid competing git pushes.
concurrency:
  group: guest-visual-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_PUBLIC_DEMO_ONLY: "true"
      PLANTLOG_BROWSER_CHANNEL: chrome

    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install checked-in dependencies
        run: npm ci

      - name: Validate synthetic data and brand fingerprints
        run: npm run test:demo

      - name: Build guest-only production-equivalent frontend
        run: npm run build

      - name: Install temporary Playwright tooling
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Verify runner-provided Chrome
        run: google-chrome --version

      - name: Capture and validate eleven current NEXUS views
        run: node scripts/capture-doc-screenshots.cjs

      - name: Commit updated PNG files and machine-readable manifest
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Replace the stale repository-root image gallery instead of
          # retaining two competing historical screenshot collections.
          git rm -f --ignore-unmatch -- \
            docs/nexus-demo-overview.png \
            docs/nexus-demo-assets.png \
            docs/nexus-demo-logs.png \
            docs/nexus-demo-insights.png \
            docs/nexus-demo-insights-mobile.png \
            docs/nexus-scenario-lab-desktop.png \
            docs/nexus-scenario-lab-mobile.png \
            docs/nexus-demo-mobile.png \
            docs/screenshots-manifest.json
          git add -A docs/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "docs(visual): refresh eleven synthetic NEXUS screenshots and SHA-256 manifest"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Preserve capture evidence if the run fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plantlog-visual-capture-failure
          path: docs/screenshots/*.png
          if-no-files-found: ignore
