name: PlantLog-MERN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  supply-chain:
    # Public dependency inventories only. No application secrets or live data.
    # HIGH/CRITICAL production dependency advisories fail CI. Dev-only
    # advisories remain visible in the report pending separate review.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verify pinned registry source and audit parser
        run: node --test scripts/verify-supply-chain.test.cjs

      - name: Install locked backend dependencies from canonical npm
        run: npm ci --prefix backend --ignore-scripts

      - name: Install locked frontend dependencies from canonical npm
        run: npm ci --prefix frontend --ignore-scripts

      - name: Audit runtime and full dependency trees and generate CycloneDX SBOMs
        run: node scripts/verify-supply-chain.cjs

      - name: Archive only non-secret component inventories and advisory summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plantlog-supply-chain-evidence
          path: |
            test-artifacts/supply-chain/supply-chain-report.json
            test-artifacts/supply-chain/backend-runtime.cdx.json
            test-artifacts/supply-chain/frontend-runtime.cdx.json
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate synthetic demo data
        run: npm run test:demo

      - name: Archive reproducible synthetic scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plantlog-synthetic-science-evidence
          path: frontend/test-artifacts/scientific-evidence.json
          if-no-files-found: warn

      - name: Test registry filters
        run: npm run test:registry

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend and verify compressed asset budgets
        run: npm run test:perf

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Test backend security policies
        run: npm test

      - name: Validate local-only pre-production Compose topology
        working-directory: .
        env:
          JWT_SECRET: ci-only-compose-validation-not-a-deployment-key-2026
        run: docker compose config --quiet

  backend-integration:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Verify authenticated API against ephemeral MongoDB
        run: npm run test:integration

  backend-restore:
    # Isolated synthetic data only: verify archive restoration into a
    # different disposable MongoDB namespace. Not an external DR test.
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install pinned backend dependencies
        run: npm ci

      - name: Verify isolated MongoDB backup and restore
        env:
          PLANTLOG_CI_MONGO_CONTAINER_ID: ${{ job.services.mongodb.id }}
        run: npm run test:restore:ci

      - name: Archive verification manifest only (never database archives)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plantlog-synthetic-restore-proof
          path: backend/test-artifacts/restore-verification.json
          if-no-files-found: warn

  backend-load:
    # Synthetic performance observations, NOT public load testing or SLA.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Exercise bounded localhost API workload and MongoDB reconnection
        env:
          PLANTLOG_CI_MONGO_CONTAINER_ID: ${{ job.services.mongodb.id }}
        run: npm run test:load:ci

      - name: Archive synthetic measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plantlog-synthetic-load-resilience
          path: backend/test-artifacts/synthetic-load-resilience.json
          if-no-files-found: warn

  frontend-browser:
    # Pinned until the project's Playwright 1.56 runtime supports newer runners.
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned frontend dependencies
        run: npm ci

      - name: Build static demo
        run: npm run build

      - name: Install and build isolated backend
        run: cd ../backend && npm ci && npm run build

      - name: Install browser test tooling in CI only
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Install isolated Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run real browser demo smoke test
        run: node --test tests/browser-smoke.test.cjs

      - name: Test authenticated operator lifecycle in a real browser
        run: node --test tests/fullstack-onboarding.test.cjs

      - name: Preserve failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plantlog-browser-smoke-failure
          path: frontend/test-artifacts/
          if-no-files-found: ignore
