name: PlantLog-MERN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate synthetic demo data
        run: npm run test:demo

      - name: Test registry filters
        run: npm run test:registry

      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Test backend security policies
        run: npm test

  backend-integration:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Verify authenticated API against ephemeral MongoDB
        run: npm run test:integration

  frontend-browser:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned frontend dependencies
        run: npm ci

      - name: Build static demo
        run: npm run build

      - name: Install and build isolated backend
        run: cd ../backend && npm ci && npm run build

      - name: Install browser test tooling in CI only
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Install isolated Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run real browser demo smoke test
        run: node --test tests/browser-smoke.test.cjs

      - name: Test authenticated operator lifecycle in a real browser
        run: node --test tests/fullstack-onboarding.test.cjs

      - name: Preserve failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plantlog-browser-smoke-failure
          path: frontend/test-artifacts/
          if-no-files-found: ignore
