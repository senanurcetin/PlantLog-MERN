<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">PlantLog industrial asset and maintenance logbook</title>
<desc id="desc">Concept overview showing equipment registration, maintenance logging, and shift handover. An illustration, not an application screenshot or evidence of live plant telemetry.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0A1927"/><stop offset="1" stop-color="#173D43"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#A3D8C8" stroke-opacity=".08"/></pattern></defs>
<rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/>
