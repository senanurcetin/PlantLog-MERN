<text x="60" y="183" font-family="Arial,sans-serif" font-weight="800" font-size="82" fill="#FFFFFF">PlantLog</text>
<text x="60" y="258" font-family="Arial,sans-serif" font-weight="700" font-size="32" fill="#B9F4D6">Assets. Maintenance. Shift logs.</text>
<text x="60" y="325" font-family="Arial,sans-serif" font-size="22" fill="#C0D7DF">One traceable workflow for equipment</text><text x="60" y="358" font-family="Arial,sans-serif" font-size="22" fill="#C0D7DF">status and operational handovers.</text>
